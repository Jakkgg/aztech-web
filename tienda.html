<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda — AZ TECH | Consolas en venta en Río Grande</title>
<meta name="description" content="Consolas en venta en Río Grande, Tierra del Fuego. Revisadas y listas para jugar.">
<link rel="canonical" href="https://jakkgg.github.io/aztech-web/tienda.html">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#DCC9A9;
    --cream-lt:#EDE0C8;
    --cream-dk:#C9B48D;
    --ink:#1B1712;
    --ink-soft:#3A3226;
    --orange:#D9782F;
    --orange-dk:#A85A20;
    --green:#4E6851;
    --green-dk:#354A39;
    --paper:#F1E6D2;
    --fb-blue:#1877F2;
    --fb-blue-dk:#0F5AC7;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}

  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(var(--ink) 1px, transparent 1.2px);
    background-size: 5px 5px;
    opacity:0.05;
    pointer-events:none;
    z-index:400;
  }

  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}

  .wrap{max-width:1120px; margin:0 auto; padding:0 24px;}

  .eyebrow{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--orange);
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{content:"●"; font-size:8px; color:var(--orange);}

  h1,h2,h3{
    font-family:'Bangers', cursive;
    font-weight:400;
    letter-spacing:0.02em;
  }

  /* thick-border comic card mixin via class */
  .ink-card{
    border:3px solid var(--ink);
    box-shadow:7px 7px 0 var(--ink);
    background:var(--paper);
  }

  /* ==================================================================
     INTRO SPLASH — rápida: fondo naranja girando + logo que aparece
     chiquito, pega un salto grande, y se achica de nuevo. Todo en
     poco más de un segundo.
     ================================================================== */
  #intro-splash{
    position:fixed;
    inset:0;
    z-index:9999;
    background:var(--orange);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    animation: introOut .3s ease forwards;
    animation-delay:1.05s;
  }
  #intro-splash .spin-bg{
    position:absolute;
    width:260vmax;
    height:260vmax;
    left:50%; top:50%;
    margin-left:-130vmax;
    margin-top:-130vmax;
    background:
      repeating-conic-gradient(
        var(--ink) 0deg 12deg,
        transparent 12deg 30deg
      );
    opacity:0.16;
    animation: spinBg 1.3s cubic-bezier(.3,0,.4,1) forwards;
  }
  @keyframes spinBg{
    0%{   transform:rotate(0deg)   scale(0.3); opacity:0; }
    12%{  opacity:.16; }
    100%{ transform:rotate(650deg) scale(1);   opacity:.16; }
  }

  #intro-splash .intro-logo{
    position:relative;
    z-index:2;
    width:min(50vw, 280px);
    height:auto;
    opacity:0;
    filter:drop-shadow(0 8px 0 rgba(0,0,0,0.25));
    animation: logoBeat 1.1s cubic-bezier(.37,0,.63,1) forwards;
  }

  @keyframes logoBeat{
    0%{   transform:scale(0.12); opacity:0; }
    12%{  opacity:1; }
    50%{  transform:scale(1.3);  opacity:1; }
    88%{  opacity:1; }
    100%{ transform:scale(0.12); opacity:0; }
  }

  @keyframes introOut{
    0%{   opacity:1; visibility:visible; }
    100%{ opacity:0; visibility:hidden; pointer-events:none; }
  }

  #intro-splash.skip-now{
    animation: introOut .3s ease forwards !important;
    animation-delay:0s !important;
  }
  #intro-splash.skip-now .intro-logo,
  #intro-splash.skip-now .spin-bg{ animation:none; opacity:0; }

  @media (prefers-reduced-motion: reduce){
    #intro-splash{ animation:introOut .01s linear forwards; animation-delay:0s; }
    #intro-splash .spin-bg{ display:none; }
    #intro-splash .intro-logo{ animation:none; opacity:1; }
  }

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:100;
    background:var(--cream);
    border-bottom:3px solid var(--ink);
  }
  nav{
    max-width:1200px; margin:0 auto; padding:16px 24px;
    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:20px;
  }
  .brand{
    font-family:'Bangers', cursive;
    font-size:26px;
    letter-spacing:0.04em;
    color:var(--ink);
    display:flex; align-items:center; gap:10px;
  }
  .brand .badge-dot{
    width:16px; height:16px; border-radius:50%;
    background:var(--orange);
    border:2px solid var(--ink);
  }
  .brand-logo{
    height:46px;
    width:auto;
    display:block;
    transition:transform .25s ease;
  }
  .brand:hover .brand-logo{
    transform:scale(1.08) rotate(-4deg);
  }
  .brand:active .brand-logo{
    transform:scale(0.94) rotate(2deg);
  }
  .navlinks{
    display:flex; gap:26px;
    justify-content:center;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .navlinks a{transition:color .15s;}
  .navlinks a:hover{color:var(--orange);}
  .nav-ctas{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;
  }
  .nav-cta{
    font-family:'Space Mono', monospace;
    font-weight:700; font-size:12px; letter-spacing:0.06em; text-transform:uppercase;
    padding:9px 18px;
    background:var(--green);
    color:var(--cream-lt);
    border:2.5px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);
    transition:transform .12s, box-shadow .12s;
    display:inline-flex; align-items:center; gap:7px;
  }
  .nav-cta:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink);}
  .nav-cta.fb{
    background:var(--fb-blue);
  }
  .nav-cta.ig{
    background:linear-gradient(45deg, #F58529, #DD2A7B, #8134AF, #515BD4);
  }
  @media (max-width:760px){ .navlinks{display:none;} }
  @media (max-width:480px){ .nav-cta span.txt{display:none;} .nav-cta{padding:9px 12px;} }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;

    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:24px 0 90px;

    text-align:center;
    overflow:hidden;

    background:
      radial-gradient(circle at 12% 20%, rgba(217,120,47,.12), transparent 40%),
      radial-gradient(circle at 88% 75%, rgba(78,104,81,.14), transparent 45%),
      var(--cream);
  }
  .hero .wrap{
    position:relative;
    z-index:2;

    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .hero .burst{
    position:absolute; top:-120px; left:50%; transform:translateX(-50%);
    width:640px; height:640px;
    background:
      repeating-conic-gradient(var(--ink) 0deg 4deg, transparent 4deg 16deg);
    opacity:0.06;
    border-radius:50%;
    pointer-events:none;
  }
  .hero-sticker{
    position:relative; z-index:2;
    display:inline-block;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    background:var(--orange);
    color:var(--cream-lt);
    padding:9px 18px;
    border:2.5px solid var(--ink);
    box-shadow:4px 4px 0 var(--ink);
    transform:rotate(-3deg);
    margin-bottom:22px;
  }
  .hero h1{
    position:relative; z-index:2;
    font-size:clamp(58px, 12vw, 128px);
    line-height:0.9;
    color:var(--orange);
    -webkit-text-stroke:2px var(--ink);
    text-shadow:
      6px 6px 0 var(--ink-soft);
  }
  .hero .sub{
    position:relative; z-index:2;
    margin-top:26px;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--green-dk);
  }
  .hero p.lead{
    position:relative; z-index:2;
    max-width:540px; margin:36px auto 0;
    font-size:19px; color:var(--ink-soft); line-height:1.55;
  }
  .hero .ctas{
    position:relative; z-index:2;
    margin-top:22px;
    display:flex; gap:18px; justify-content:center; flex-wrap:wrap;
  }
  .btn-primary{
    font-family:'Space Mono', monospace;
    font-weight:700; font-size:13.5px; letter-spacing:0.08em; text-transform:uppercase;
    padding:17px 32px;
    background:var(--orange);
    color:var(--cream-lt);
    border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    display:inline-flex; align-items:center; gap:10px;
    transition:transform .12s, box-shadow .12s;
  }
  .btn-primary:hover{transform:translate(-3px,-3px); box-shadow:8px 8px 0 var(--ink);}
  .btn-ghost{
    font-family:'Space Mono', monospace;
    font-weight:700; font-size:13.5px; letter-spacing:0.08em; text-transform:uppercase;
    padding:17px 32px;
    background:var(--cream-lt);
    color:var(--ink);
    border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    transition:transform .12s, box-shadow .12s;
  }
  .btn-ghost:hover{transform:translate(-3px,-3px); box-shadow:8px 8px 0 var(--ink);}

  /* ---------- SECTION shared ---------- */
  section{padding:96px 0;}
  .sec-head{max-width:640px; margin-bottom:52px;}
  .sec-head h2{
    font-size:clamp(34px,5.5vw,52px);
    margin-top:12px;
    color:var(--ink);
  }
  .sec-head p{margin-top:14px; font-size:17px; color:var(--ink-soft); line-height:1.6;}

  /* ---------- SERVICES ---------- */
  .services{background:var(--cream-dk); border-top:3px solid var(--ink); border-bottom:3px solid var(--ink);}
  .svc-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:24px;
  }
  @media (max-width:900px){ .svc-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .svc-grid{grid-template-columns:1fr;} }

  .svc-card{
    padding:30px 24px;
    position:relative;
    transition:transform .15s, box-shadow .15s;
  }
  .svc-card:hover{transform:translate(-3px,-3px); box-shadow:10px 10px 0 var(--ink);}
  .svc-num{
    font-family:'Space Mono', monospace; font-weight:700;
    font-size:11px; color:var(--orange); letter-spacing:0.1em;
  }
  .svc-icon{margin:16px 0 14px; color:var(--ink);}
  .svc-card h3{font-size:24px; color:var(--ink); text-transform:uppercase;}
  .svc-card p{margin-top:8px; font-size:14.5px; color:var(--ink-soft); line-height:1.55;}

  /* ---------- SPOTLIGHT: PlayStation ---------- */
  .spotlight{
    position:relative;
    background:var(--cream);
  }
  .spot-grid{
    display:grid; grid-template-columns:0.9fr 1.1fr; gap:56px; align-items:start;
  }
  @media (max-width:860px){ .spot-grid{grid-template-columns:1fr;} }

  .spot-left h2{font-size:clamp(30px,4.8vw,46px); color:var(--ink); margin-top:12px; line-height:1.02;}
  .spot-left p{margin-top:16px; color:var(--ink-soft); font-size:16.5px; line-height:1.65;}

  .speech-bubble{
    position:relative;
    margin-top:28px;
    background:var(--green);
    color:var(--cream-lt);
    padding:20px 22px;
    border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    font-family:'Space Mono', monospace;
    font-size:13.5px;
    line-height:1.65;
    border-radius:14px;
  }
  .speech-bubble::after{
    content:"";
    position:absolute; left:36px; bottom:-16px;
    width:0; height:0;
    border:10px solid transparent;
    border-top-color:var(--ink);
    border-bottom:0;
  }
  .speech-bubble::before{
    content:"";
    position:absolute; left:38px; bottom:-11px;
    width:0; height:0;
    border:8px solid transparent;
    border-top-color:var(--green);
    border-bottom:0;
    z-index:1;
  }

  .card-panel{background:var(--paper); border:3px solid var(--ink); box-shadow:8px 8px 0 var(--ink);}
  .card-panel .cp-head{
    padding:16px 22px;
    border-bottom:3px solid var(--ink);
    background:var(--orange);
    display:flex; align-items:center; gap:10px;
  }
  .card-panel .cp-head .dot{width:9px;height:9px;border-radius:50%;background:var(--cream-lt); border:1.5px solid var(--ink);}
  .card-panel .cp-head span{
    font-family:'Space Mono', monospace; font-weight:700;
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--cream-lt);
  }
  .cp-body{padding:26px 26px 30px;}
  .cp-block{margin-bottom:24px;}
  .cp-block:last-child{margin-bottom:0;}
  .cp-block h4{
    font-family:'Bangers', cursive;
    font-size:20px; letter-spacing:0.02em; color:var(--ink); margin-bottom:8px;
  }
  .cp-block ul li{position:relative; padding-left:18px; font-size:15px; color:var(--ink-soft); line-height:1.7;}
  .cp-block ul li::before{content:"▸"; position:absolute; left:0; top:0; color:var(--orange); font-weight:700;}
  .cp-block p{font-size:15px; color:var(--ink-soft); line-height:1.7;}

  /* ---------- PROCESS ---------- */
  .process{background:var(--green); border-top:3px solid var(--ink); border-bottom:3px solid var(--ink);}
  .process .eyebrow{color:var(--cream-lt);}
  .process .eyebrow::before{color:var(--cream-lt);}
  .process .sec-head h2{color:var(--cream-lt);}
  .proc-list{display:grid; grid-template-columns:repeat(4,1fr); gap:26px;}
  @media (max-width:860px){ .proc-list{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .proc-list{grid-template-columns:1fr;} }
  .proc-item{
    background:var(--cream-lt);
    border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    padding:22px;
  }
  .proc-item .pn{
    font-family:'Bangers', cursive;
    font-size:42px;
    color:var(--orange);
    line-height:1;
  }
  .proc-item h3{margin-top:10px; font-size:19px; color:var(--ink); text-transform:uppercase;}
  .proc-item p{margin-top:8px; font-size:14.5px; color:var(--ink-soft); line-height:1.55;}

  /* ---------- FAQ ---------- */
  .faq{background:var(--cream); border-top:3px solid var(--ink); border-bottom:3px solid var(--ink);}
  .faq-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:52px 40px;
  }
  @media (max-width:760px){ .faq-grid{grid-template-columns:1fr; gap:46px;} }

  .faq-item{display:flex; flex-direction:column;}
  .faq-q{
    align-self:flex-start;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    background:var(--orange);
    color:var(--cream-lt);
    padding:11px 18px;
    border:2.5px solid var(--ink);
    box-shadow:4px 4px 0 var(--ink);
    transform:rotate(-1.4deg);
    max-width:88%;
  }
  .faq-a{
    position:relative;
    align-self:flex-end;
    max-width:92%;
    margin-top:14px;
    background:var(--paper);
    border:3px solid var(--ink);
    box-shadow:6px 6px 0 var(--ink);
    border-radius:20px;
    padding:20px 24px;
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.65;
  }
  .faq-a::after{
    content:"";
    position:absolute; left:30px; top:-15px;
    width:0; height:0;
    border:9px solid transparent;
    border-bottom-color:var(--ink);
    border-top:0;
  }
  .faq-a::before{
    content:"";
    position:absolute; left:32px; top:-10px;
    width:0; height:0;
    border:7px solid transparent;
    border-bottom-color:var(--paper);
    border-top:0;
    z-index:1;
  }
  .faq-item:nth-child(even) .faq-q{
    background:var(--green);
    align-self:flex-end;
    transform:rotate(1.4deg);
  }
  .faq-item:nth-child(even) .faq-a{
    align-self:flex-start;
  }
  .faq-item:nth-child(even) .faq-a::after{
    left:auto; right:30px;
  }
  .faq-item:nth-child(even) .faq-a::before{
    left:auto; right:32px;
  }

  /* ---------- ABOUT ---------- */
  .about-grid{display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center;}
  @media (max-width:860px){ .about-grid{grid-template-columns:1fr;} }
  .about-copy p{font-size:16.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:16px;}
  .about-copy strong{color:var(--ink); font-weight:700;}

  .polaroid{
    display:inline-block;
    background:var(--cream-lt);
    border:3px solid var(--ink);
    box-shadow:6px 6px 0 var(--ink);
    padding:10px 10px 16px;
    transform:rotate(-2.5deg);
    margin-bottom:26px;
  }
  .polaroid img{
    display:block;
    width:150px; height:150px;
    object-fit:cover;
    border:2px solid var(--ink);
  }
  .polaroid .cap{
    margin-top:10px;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:11.5px;
    letter-spacing:0.04em;
    text-align:center;
    color:var(--ink-soft);
  }

  .stat-panel{background:var(--paper); border:3px solid var(--ink); box-shadow:8px 8px 0 var(--ink); padding:32px;}
  .stat-row{display:flex; justify-content:space-between; padding:15px 0; border-bottom:2px dashed var(--ink-soft);}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .label{
    font-family:'Space Mono', monospace; font-weight:700;
    font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft);
  }
  .stat-row .value{font-family:'Bangers', cursive; font-size:18px; color:var(--ink); text-align:right;}

  /* ---------- CLIENTES ---------- */
  .clientes{
    background:var(--green);
    border-top:3px solid var(--ink);
    border-bottom:3px solid var(--ink);
  }
  .clientes .eyebrow{color:var(--cream-lt);}
  .clientes .eyebrow::before{color:var(--cream-lt);}
  .clientes .sec-head h2{color:var(--cream-lt);}
  .clientes .sec-head p{color:var(--cream-dk);}
  .clientes-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
  }
  @media (max-width:860px){ .clientes-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ .clientes-grid{grid-template-columns:1fr;} }
  .cl-tile{
    aspect-ratio:1/1;
    background:var(--cream-lt);
    border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:var(--ink-soft);
    text-align:center;
    padding:14px;
  }
  .cl-tile.filled{padding:0; overflow:hidden; position:relative; cursor:pointer;}
  .cl-tile.filled img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s ease, filter .3s ease;}
  .cl-tile.filled:hover img{transform:scale(1.08); filter:brightness(.75);}
  .cl-tile.filled::after{
    content:"🔍 Ver foto";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--cream-lt);
    text-shadow:0 1px 3px rgba(0,0,0,.6);
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
  }
  .cl-tile.filled:hover::after{opacity:1;}

  /* ---------- LIGHTBOX ---------- */
  #lightbox{
    position:fixed; inset:0; z-index:2000;
    background:rgba(27,23,18,0.92);
    display:none;
    align-items:center; justify-content:center;
    padding:40px 20px;
    cursor:zoom-out;
  }
  #lightbox.open{display:flex;}
  #lightbox img{
    max-width:min(900px, 92vw);
    max-height:86vh;
    object-fit:contain;
    border:3px solid var(--cream-lt);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    cursor:default;
  }
  #lightbox .lb-close{
    position:absolute;
    top:22px; right:26px;
    width:42px; height:42px;
    border-radius:50%;
    background:var(--cream-lt);
    border:2px solid var(--ink);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    font-size:18px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .cl-tile .plus{
    font-family:'Bangers', cursive;
    font-size:34px;
    color:var(--green-dk);
    line-height:1;
  }
  .cl-tile .cl-label{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }

  /* ---------- RESEÑAS ---------- */
  .resenas{background:var(--cream); border-top:3px solid var(--ink); border-bottom:3px solid var(--ink);}
  .resenas-layout{
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:40px;
    align-items:start;
  }
  @media (max-width:900px){ .resenas-layout{grid-template-columns:1fr;} }

  .resenas-grid{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .resena-card{
    background:var(--paper);
    border:3px solid var(--ink);
    box-shadow:6px 6px 0 var(--ink);
    padding:22px 24px;
  }
  .resena-card .rc-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .resena-card .rc-name{
    font-family:'Bangers', cursive;
    font-size:19px;
    color:var(--ink);
  }
  .resena-card .rc-stars{
    font-size:16px;
    letter-spacing:2px;
    color:var(--cream-dk);
  }
  .resena-card .rc-stars .on{ color:var(--orange); }
  .resena-card .rc-text{
    margin-top:10px;
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.65;
  }
  .resena-card .rc-photo{
    margin-top:14px;
    width:120px; height:120px;
    object-fit:cover;
    border:2.5px solid var(--ink);
    cursor:pointer;
    display:block;
  }
  .resenas-empty{
    font-family:'Space Mono', monospace;
    font-size:14px;
    color:var(--ink-soft);
    border:2px dashed var(--ink-soft);
    padding:24px;
    text-align:center;
  }

  .resena-form{padding:28px 26px;}
  .resena-form h3{
    font-size:24px;
    color:var(--ink);
    margin-bottom:16px;
  }
  .rf-label{
    display:block;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:11.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:16px 0 6px;
  }
  .rf-label:first-of-type{ margin-top:0; }
  .rf-input{
    width:100%;
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--cream-lt);
    border:2.5px solid var(--ink);
    padding:11px 14px;
    resize:vertical;
  }
  .rf-input:focus{ outline:3px solid var(--orange); outline-offset:1px; }
  .rf-stars{ display:flex; gap:6px; }
  .rf-star{
    font-size:30px;
    line-height:1;
    background:none;
    border:none;
    color:var(--cream-dk);
    cursor:pointer;
    padding:2px;
    transition:transform .1s ease;
  }
  .rf-star:hover{ transform:scale(1.15); }
  .rf-star.on{ color:var(--orange); }
  .rf-file{
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .rf-preview{ margin-top:10px; }
  .rf-preview img{
    width:90px; height:90px;
    object-fit:cover;
    border:2.5px solid var(--ink);
  }
  .rf-submit{ width:100%; justify-content:center; margin-top:22px; }
  .rf-note{
    margin-top:12px;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  /* ---------- CONTACT ---------- */
  .contact{
    position:relative; text-align:center;
    background:var(--ink);
    border-top:3px solid var(--ink);
  }
  .contact .eyebrow{color:var(--orange);}
  .contact .eyebrow::before{color:var(--orange);}
  .contact h2{font-size:clamp(38px,6.5vw,64px); color:var(--cream-lt);}
  .contact p.lead{max-width:520px; margin:16px auto 0; color:var(--cream-dk); font-size:17px; line-height:1.6;}
  .contact-details{margin-top:44px; display:flex; justify-content:center; gap:44px; flex-wrap:wrap;}
  .cd-item{text-align:left; min-width:180px;}
  .cd-item .cd-label{
    font-family:'Space Mono', monospace; font-weight:700;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--orange);
  }
  .cd-item .cd-value{margin-top:8px; font-size:17px; color:var(--cream-lt); font-weight:600;}
  .contact .big-cta{margin-top:44px; display:flex; gap:18px; justify-content:center; flex-wrap:wrap;}
  .whatsapp-btn{
    font-family:'Space Mono', monospace; font-weight:700;
    font-size:15px; letter-spacing:0.05em; text-transform:uppercase;
    padding:20px 42px;
    background:var(--green);
    color:var(--cream-lt);
    border:3px solid var(--cream-lt);
    box-shadow:6px 6px 0 var(--orange);
    display:inline-flex; align-items:center; gap:12px;
    transition:transform .12s, box-shadow .12s;
  }
  .whatsapp-btn:hover{transform:translate(-3px,-3px); box-shadow:9px 9px 0 var(--orange);}
  .facebook-btn{
    font-family:'Space Mono', monospace; font-weight:700;
    font-size:15px; letter-spacing:0.05em; text-transform:uppercase;
    padding:20px 42px;
    background:var(--fb-blue);
    color:var(--cream-lt);
    border:3px solid var(--cream-lt);
    box-shadow:6px 6px 0 var(--orange);
    display:inline-flex; align-items:center; gap:12px;
    transition:transform .12s, box-shadow .12s;
  }
  .facebook-btn:hover{transform:translate(-3px,-3px); box-shadow:9px 9px 0 var(--orange);}
  .instagram-btn{
    font-family:'Space Mono', monospace; font-weight:700;
    font-size:15px; letter-spacing:0.05em; text-transform:uppercase;
    padding:20px 42px;
    background:linear-gradient(45deg, #F58529, #DD2A7B, #8134AF, #515BD4);
    color:var(--cream-lt);
    border:3px solid var(--cream-lt);
    box-shadow:6px 6px 0 var(--orange);
    display:inline-flex; align-items:center; gap:12px;
    transition:transform .12s, box-shadow .12s;
  }
  .instagram-btn:hover{transform:translate(-3px,-3px); box-shadow:9px 9px 0 var(--orange);}

  /* ---------- FOOTER ---------- */
  footer{padding:32px 24px; background:var(--ink);}
  .foot-wrap{
    max-width:1120px; margin:0 auto;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
  }
  .foot-wrap .brand{font-size:19px; color:var(--cream-lt);}
  .foot-wrap .brand .badge-dot{background:var(--orange); border-color:var(--cream-lt);}
  footer .fine{font-family:'Space Mono', monospace; font-size:11.5px; color:var(--cream-dk); letter-spacing:0.03em;}

  /* ---------- AUTH (login / registro) ---------- */
  .auth-area{ display:flex; align-items:center; gap:8px; }
  .auth-hello{
    font-family:'Space Mono', monospace; font-weight:700; font-size:11px;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-soft);
    white-space:nowrap;
  }
  .nav-cta.auth-register{ background:var(--orange); }
  .nav-cta.auth-logout{ background:var(--ink); }

  .modal-overlay{
    position:fixed; inset:0; z-index:3000;
    background:rgba(27,23,18,0.78);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--paper); border:3px solid var(--ink); box-shadow:8px 8px 0 var(--ink);
    max-width:380px; width:100%; padding:30px 26px 26px; position:relative;
  }
  .modal-close{
    position:absolute; top:12px; right:14px;
    background:none; border:none; font-size:20px; line-height:1; cursor:pointer; color:var(--ink);
  }
  .modal-tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .modal-tab{
    flex:1; padding:10px; font-family:'Space Mono', monospace; font-weight:700; font-size:11.5px;
    text-transform:uppercase; letter-spacing:0.05em;
    background:var(--cream-lt); border:2px solid var(--ink); cursor:pointer; color:var(--ink-soft);
  }
  .modal-tab.active{ background:var(--orange); color:var(--cream-lt); }
  .modal-msg{ font-size:13px; color:var(--ink-soft); line-height:1.5; margin-bottom:16px; display:none; }
  .modal-box h3{ font-size:22px; margin-bottom:4px; }
  .auth-error{ color:#B0413E; font-size:12.5px; margin-top:10px; display:none; }

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
  a:focus-visible, button:focus-visible{outline:3px solid var(--orange); outline-offset:3px;}
</style>
